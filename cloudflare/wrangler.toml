# Test site for AR development, served from the ar-dev branch.
# Deploy with `npx wrangler deploy -c cloudflare/wrangler.toml` from the repo root,
# or push to ar-dev and let .github/workflows/deploy-test.yml do it.
name = "soe-3dwrecks-test"
compatibility_date = "2026-07-29"
account_id = "bf3adee8d2b257177102b9f0096a5383"

workers_dev = false
preview_urls = false

routes = [
  { pattern = "test-3dwrecks.southernoceanexploration.com", custom_domain = true }
]

[assets]
directory = "../site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
