<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipwreck Viewer</title>
    <meta name="theme-color" content="#001122">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/0.179.1/three.module.js",
            "belowjs": "/vendor/belowjs/1.8.0-dev.5bf0695/belowjs.js"
        }
    }
    </script>
    <!-- Test site: three.js and BelowJS are served from /vendor/ (BelowJS built from abeachsomewhere123/belowjs 5bf0695, with seabed passthrough). Live still uses the CDN. -->
    <link rel="stylesheet" href="/vendor/belowjs/1.8.0-dev.5bf0695/belowjs.css">
    <link rel="stylesheet" href="/assets/viewer.css">
    <link rel="stylesheet" href="/assets/wreck-extras.css?v=cac290bd">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #001122;
            color: #cfe4f2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #viewer { position: fixed; inset: 0; z-index: 0; }

        /* Survey only: no Survey/Dive switch. */
        .dive-mode-toggle-container { display: none !important; }

        /* SOE logo beside the name in the info panel. The logo is black on
           transparent, so it is inverted to white for the dark panel. */
        .soe-title { display: flex; align-items: center; gap: 12px; }
        .soe-title__logo { flex: none; width: 56px; height: auto; filter: invert(1); opacity: 0.95; }
        @media (max-width: 600px), (max-height: 500px) {
            .soe-title { gap: 8px; }
            .soe-title__logo { width: 34px; }
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 2rem;
            text-align: center;
            background: #001122;
        }

        #status[hidden] { display: none; }

        #status h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        #status p {
            margin: 0;
            max-width: 38ch;
            font-size: 0.85rem;
            line-height: 1.55;
            color: #7fa3ba;
        }

        #status code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8rem;
            color: #cfe4f2;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="status"><h1>Loading models</h1></div>

    <script type="module">
        // ────────────────────────────────────────────────────────────────
        // The address of your Cloudflare Worker — the thing that reports
        // what's in the bucket. The Worker also serves the model files from
        // the same address, so you don't set that here.
        //
        // Fallback if the custom domain ever stops working:
        // https://shipwreck-models.abeachsomewhere.workers.dev
        const MODELS_API = 'https://models.southernoceanexploration.com';
        // ────────────────────────────────────────────────────────────────

        import { ModelViewer } from 'belowjs';
        import { addBackLink, showXrPrompt } from '/assets/xr-prompt.js';
        import { fitStartViewToScreen } from '/assets/fit-view.js';
        import { addVrStarts } from '/assets/xr-start.js';
        import { addUnderwater } from '/assets/underwater.js?v=8bfe6ef1';
        import { addWreckExtras } from '/assets/wreck-extras.js?v=babbf198';
        import { addVrExit } from '/assets/vr-exit.js';

        const statusEl = document.getElementById('status');

        function showStatus(heading, detail) {
            statusEl.innerHTML = '';
            const h = document.createElement('h1');
            h.textContent = heading;
            statusEl.appendChild(h);
            if (detail) {
                const p = document.createElement('p');
                p.innerHTML = detail;
                statusEl.appendChild(p);
            }
            statusEl.hidden = false;
        }

        async function start() {
            let data;
            try {
                const res = await fetch(MODELS_API, { cache: 'no-cache' });
                if (!res.ok) throw new Error(`the model list returned ${res.status}`);
                data = await res.json();
            } catch (err) {
                console.error(err);
                showStatus(
                    'Could not reach the model list',
                    'Open <code>models-api.abeachsomewhere.net</code> in a browser tab. If it does not respond, the Worker is not deployed or its subdomain is not connected yet. Details are in the browser console.'
                );
                return;
            }

            if (data.error) {
                showStatus('The model list reported a problem', data.error);
                return;
            }

            const models = data.models || {};
            const keys = Object.keys(models);

            if (keys.length === 0) {
                showStatus(
                    'No models yet',
                    'Upload a <code>.glb</code> file to your R2 bucket and refresh this page. The filename becomes the name shown here.'
                );
                return;
            }

            addVrStarts(models);

            const viewer = new ModelViewer(document.getElementById('viewer'), {
                // Draco and KTX2 decoders and VR controller models: self-hosted (see /vendor/README.md).
                assetBasePath: '/vendor/below-assets/',
                enableVR: true,
                showInfo: true,
                models: models,
                enableVRComfortGlyph: true,
                enableFullscreen: true,
                enableScreenshot: true,
                autoLoadFirst: false,
                viewerConfig: {
                    scene: { background: '#001122' },
                    // On passthrough headsets, standing on the sand in VR shows
                    // the room with the wreck around you at full scale.
                    // Eyes 3 m above the sand when standing on it, whatever
                    // your height, so you look across the wreck, not along the sand.
                    vr: { passthroughOnSeabed: true, passthroughEyeHeight: 3 }
                }
            });

            // Share a link to one model: /view/?model=euro (add &mode=vr to prompt for VR)
            const params = new URLSearchParams(location.search);
            const requested = params.get('model');
            const initial = requested && models[requested] ? requested : keys[0];

            // BelowJS hardcodes "BelowJS" as the info panel title, so swap it
            // for the SOE logo and name.
            const setInfoTitle = () => {
                const title = viewer.ui?.info?.querySelector('.info-panel__title');
                if (!title || title.querySelector('.soe-title__logo')) return;
                title.textContent = '';
                title.classList.add('soe-title');
                const logo = document.createElement('img');
                logo.className = 'soe-title__logo';
                logo.src = '/assets/soe-logo.webp';
                logo.alt = '';
                logo.width = 56;
                logo.height = 42;
                const name = document.createElement('span');
                name.textContent = 'Southern Ocean Exploration';
                title.append(logo, name);
            };
            setInfoTitle();

            // No dive mode: the Survey/Dive switch is hidden (CSS above) and
            // the Z key and VR buttons can no longer turn it on. The dive
            // system stays loaded because it also provides the survey lighting.
            const keepSurveyMode = () => {
                const dive = viewer.diveSystem;
                if (!dive || dive.surveyOnly) return !!dive;
                const setDiveMode = dive.setDiveMode.bind(dive);
                dive.setDiveMode = () => setDiveMode(false);
                dive.surveyOnly = true;
                setDiveMode(false);
                return true;
            };
            if (!keepSurveyMode()) {
                const wait = setInterval(() => { if (keepSurveyMode()) clearInterval(wait); }, 100);
            }

            // BelowJS also sets the tab to "BelowJS – <model>" on every load.
            const titleEl = document.querySelector('title');
            new MutationObserver(() => {
                if (document.title.startsWith('BelowJS')) {
                    document.title = document.title.replace(/^BelowJS/, 'Southern Ocean Exploration');
                }
            }).observe(titleEl, { childList: true, characterData: true, subtree: true });

            fitStartViewToScreen(viewer);
            // Water, seabed and marine snow. ?water=off shows the bare scan.
            if (params.get('water') !== 'off') addUnderwater(viewer);
            // Points of interest, depth gauge and then and now, for wrecks
            // with a file in /assets/wrecks/. Added after the water so the
            // model is already level when it measures the sand.
            addWreckExtras(viewer);
            // Exit VR button on the right wrist.
            addVrExit(viewer);
            addBackLink();
            showXrPrompt(viewer, params.get('mode'));

            statusEl.hidden = true;
            setTimeout(() => {
                setInfoTitle();
                viewer.loadModel(initial);
            }, 100);
        }

        start();
    </script>
</body>
</html>
