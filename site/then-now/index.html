<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Then and Now</title>
    <meta name="description" content="Drag the slider to compare the wreck today with a reconstruction of the ship, and spin it to look round.">
    <meta name="theme-color" content="#001122">

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/0.179.1/three.module.js",
            "belowjs": "/vendor/belowjs/1.8.0-dev.5bf0695/belowjs.js"
        }
    }
    </script>
    <link rel="stylesheet" href="/vendor/belowjs/1.8.0-dev.5bf0695/belowjs.css">
    <link rel="stylesheet" href="/assets/viewer.css">

    <style>
        :root {
            --ink: #ffffff;
            --muted: #b9cfdd;
            --accent: #ffd36b;
            --glass: rgba(2, 22, 36, 0.72);
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: #001122;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #viewer { position: fixed; inset: 0; z-index: 0; }

        /* A cut-down view: none of the BelowJS panels and buttons. */
        .info-panel, .dive-mode-toggle-container, .measurement-panel,
        .belowjs-screenshot-button, .screenshot-button, .fullscreen-button,
        .vr-comfort-circle, .vr-comfort-glyph, #VRButton, #ARButton { display: none !important; }

        /* Header: logo, wreck name, a line on what this is. */
        .tn-head {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .tn-head img { width: 52px; height: auto; filter: invert(1); opacity: 0.95; }
        .tn-head h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: 0.02em; }
        .tn-head p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }

        /* The comparison: a divider across the view and a grip to drag. */
        .tn-divider {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 4;
            width: 0;
            border-left: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .tn-grip {
            position: fixed;
            top: 50%;
            z-index: 6;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
            display: grid;
            place-items: center;
            cursor: ew-resize;
            touch-action: none;
            outline: none;
        }
        .tn-grip:focus-visible { box-shadow: 0 0 0 3px var(--accent), 0 4px 16px rgba(0, 0, 0, 0.45); }
        .tn-grip svg { width: 28px; height: 28px; }

        .tn-label {
            position: fixed;
            bottom: 72px;
            z-index: 5;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--glass);
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .tn-label small { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.02em; text-transform: none; color: var(--muted); }
        .tn-label--then { left: 16px; }
        .tn-label--now { right: 16px; text-align: right; }

        /* Spin on and off. */
        .tn-spin {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 6;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 999px;
            background: var(--glass);
            color: var(--ink);
            font: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .tn-spin:hover, .tn-spin:focus-visible { border-color: var(--accent); outline: none; }
        .tn-spin svg { width: 14px; height: 14px; }

        .tn-note {
            position: fixed;
            left: 50%;
            bottom: 20px;
            z-index: 5;
            transform: translateX(-50%);
            max-width: min(560px, calc(100% - 300px));
            font-size: 0.72rem;
            line-height: 1.4;
            text-align: center;
            color: var(--muted);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }

        .tn-hint {
            position: fixed;
            left: 50%;
            top: calc(50% + 40px);
            z-index: 5;
            transform: translateX(-50%);
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--glass);
            font-size: 0.78rem;
            color: var(--muted);
            pointer-events: none;
            transition: opacity 0.6s;
        }

        #status {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            padding: 2rem;
            text-align: center;
            background: #001122;
        }
        #status[hidden] { display: none; }
        #status h1 { margin: 0; font-size: 1.05rem; font-weight: 500; }
        #status p { margin: 0; max-width: 38ch; font-size: 0.85rem; line-height: 1.55; color: #7fa3ba; }

        @media (max-width: 640px) {
            .tn-head img { width: 36px; }
            .tn-head h1 { font-size: 1rem; }
            .tn-head p { display: none; }
            .tn-note { display: none; }
            .tn-label { bottom: 70px; }
        }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <header class="tn-head">
        <img src="/assets/soe-logo.webp" alt="" width="52" height="40">
        <div>
            <h1 id="tn-name">Then and now</h1>
            <p>Drag the slider to compare. Drag the wreck to spin it.</p>
        </div>
    </header>

    <div class="tn-divider" aria-hidden="true"></div>
    <div class="tn-grip" role="slider" tabindex="0" aria-label="Then and now" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
         aria-valuetext="Half reconstruction, half wreck">
        <svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 8 5 14l6 6M17 8l6 6-6 6"/>
        </svg>
    </div>
    <div class="tn-label tn-label--then">Then<small>Representation, indicative</small></div>
    <div class="tn-label tn-label--now">Now<small>The wreck today, scanned</small></div>

    <button class="tn-spin" type="button" aria-pressed="true">
        <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="3.5" height="10" fill="#fff"/><rect x="8.5" y="2" width="3.5" height="10" fill="#fff"/></svg>
        <span>Stop spinning</span>
    </button>
    <p class="tn-note"></p>
    <div class="tn-hint">Drag the handle</div>

    <div id="status"><h1>Loading</h1></div>

    <script type="module">
        // A cut-down, browser-only page: the wreck as scanned on one side of
        // a slider, the reconstruction on the other, rendered from the same
        // camera so the two halves line up. Drag anywhere else to spin it.
        // /then-now/?model=euro
        const MODELS_API = 'https://models.southernoceanexploration.com';

        import * as THREE from 'three';
        import { ModelViewer } from 'belowjs';
        import { addBackLink } from '/assets/xr-prompt.js';
        import { fitStartViewToScreen } from '/assets/fit-view.js';
        import { addUnderwater } from '/assets/underwater.js?v=f2581197';
        import { addWreckExtras } from '/assets/wreck-extras.js?v=ecf7aa0c';

        const statusEl = document.getElementById('status');
        const showStatus = (heading, detail) => {
            statusEl.innerHTML = '';
            const h = document.createElement('h1'); h.textContent = heading; statusEl.append(h);
            if (detail) { const p = document.createElement('p'); p.textContent = detail; statusEl.append(p); }
            statusEl.hidden = false;
        };

        async function start() {
            let models;
            try {
                const res = await fetch(MODELS_API, { cache: 'no-cache' });
                models = (await res.json()).models || {};
            } catch (err) {
                console.error(err);
                showStatus('Could not reach the model list', 'Please try again in a moment.');
                return;
            }
            // Only wrecks with a reconstruction can be compared.
            const keys = Object.keys(models);
            const hasReconstruction = async (key) => {
                try {
                    const r = await fetch(`/assets/wrecks/${encodeURIComponent(key)}.json`);
                    return r.ok && !!(await r.json()).ghost;
                } catch { return false; }
            };
            const requested = new URLSearchParams(location.search).get('model');
            let key = null;
            for (const k of [requested, 'euro', ...keys].filter(Boolean)) {
                if (models[k] && await hasReconstruction(k)) { key = k; break; }
            }
            if (!key) {
                showStatus('No reconstruction yet', 'None of the wrecks has a reconstruction to compare with.');
                return;
            }

            const one = { [key]: models[key] };
            const viewer = new ModelViewer(document.getElementById('viewer'), {
                enableVR: false,
                enableAR: false,
                enableMeasurement: false,
                enableDiveSystem: true,      // it also provides the lighting
                showDiveToggle: false,
                showInfo: false,
                showLoadingIndicator: true,
                enableFullscreen: false,
                enableScreenshot: false,
                models: one,
                autoLoadFirst: false,
                assetBasePath: '/vendor/below-assets/',
                viewerConfig: { scene: { background: '#001122' } }
            });
            document.getElementById('tn-name').textContent = models[key].name || key;
            document.title = `${models[key].name || key}: then and now`;

            fitStartViewToScreen(viewer);
            addUnderwater(viewer);
            const extras = addWreckExtras(viewer, { ui: false, dimWreck: false, inside: false });
            addBackLink();
            setUpComparison(viewer, extras);
            statusEl.hidden = true;
            setTimeout(() => viewer.loadModel(key), 100);
        }

        function setUpComparison(viewer, extras) {
            const below = viewer.belowViewer;
            const renderer = below.renderer;
            const grip = document.querySelector('.tn-grip');
            const divider = document.querySelector('.tn-divider');
            const thenLabel = document.querySelector('.tn-label--then');
            const nowLabel = document.querySelector('.tn-label--now');
            const hint = document.querySelector('.tn-hint');
            const note = document.querySelector('.tn-note');
            let split = 0.5;   // fraction of the width showing "then"

            const place = () => {
                const x = split * window.innerWidth;
                grip.style.left = divider.style.left = `${x}px`;
                grip.setAttribute('aria-valuenow', String(Math.round(split * 100)));
                grip.setAttribute('aria-valuetext', `${Math.round(split * 100)} percent reconstruction`);
                thenLabel.style.opacity = split < 0.12 ? 0 : 1;
                nowLabel.style.opacity = split > 0.88 ? 0 : 1;
            };
            place();
            window.addEventListener('resize', place);

            // Drag the grip (mouse, touch or pen), or use the arrow keys.
            let dragging = false;
            const moveTo = (clientX) => { split = Math.min(1, Math.max(0, clientX / window.innerWidth)); place(); };
            grip.addEventListener('pointerdown', (e) => {
                dragging = true;
                grip.setPointerCapture(e.pointerId);
                hint.style.opacity = 0;
                e.preventDefault();
                e.stopPropagation();
            });
            grip.addEventListener('pointermove', (e) => { if (dragging) moveTo(e.clientX); });
            grip.addEventListener('pointerup', () => { dragging = false; });
            grip.addEventListener('pointercancel', () => { dragging = false; });
            grip.addEventListener('keydown', (e) => {
                const step = e.shiftKey ? 0.1 : 0.02;
                if (e.key === 'ArrowLeft') split = Math.max(0, split - step);
                else if (e.key === 'ArrowRight') split = Math.min(1, split + step);
                else if (e.key === 'Home') split = 0;
                else if (e.key === 'End') split = 1;
                else return;
                e.preventDefault();
                hint.style.opacity = 0;
                place();
            });
            setTimeout(() => { hint.style.opacity = 0; }, 6000);

            // Render the scene twice a frame, each into its own side of the
            // divider: the reconstruction with the scanned wreck hidden, then
            // the wreck with the reconstruction hidden. The scanned sand stays
            // in both, so the seabed runs straight across.
            const render = renderer.render.bind(renderer);
            const size = new THREE.Vector2();
            renderer.render = (scene, camera) => {
                const state = extras.state;
                if (!state?.ghost || renderer.xr.isPresenting) return render(scene, camera);
                renderer.getSize(size);
                const cut = Math.round(size.x * split);
                const scan = state.wreckMeshes.filter((m) => !state.sandMeshes?.has(m));
                const show = (then) => {
                    state.ghost.group.visible = then;
                    for (const m of scan) m.visible = !then;
                };
                renderer.setScissorTest(true);
                if (cut > 0) { show(true); renderer.setScissor(0, 0, cut, size.y); render(scene, camera); }
                if (cut < size.x) { show(false); renderer.setScissor(cut, 0, size.x - cut, size.y); render(scene, camera); }
                renderer.setScissorTest(false);
                show(true);
                for (const m of scan) m.visible = true;
            };

            viewer.on('modelLoaded', () => {
                // The reconstruction fully in, the wreck at its own colours.
                // The THEN tag says it is a reconstruction, so no floating label.
                extras.setBlend(1);
                // The reconstruction is built once its data file arrives,
                // a moment after the model; finish setting up then.
                const ready = setInterval(() => {
                    const ghost = extras.state?.ghost;
                    if (!ghost) return;
                    clearInterval(ready);
                    ghost.group.traverse((o) => { if (o.isSprite) o.visible = false; });
                    note.textContent = extras.state.data.ghost?.note || '';
                }, 100);
                setTimeout(() => clearInterval(ready), 30000);
                startSpin();
            });

            // Spin: turn slowly until someone drags the wreck; the button
            // turns it on and off.
            const button = document.querySelector('.tn-spin');
            let spinning = false;
            const setSpin = (on) => {
                spinning = on;
                const controls = below.cameraManager.getControls?.();
                if (controls) { controls.autoRotate = on; controls.autoRotateSpeed = 0.7; }
                button.setAttribute('aria-pressed', String(on));
                button.querySelector('span').textContent = on ? 'Stop spinning' : 'Spin';
                button.querySelector('svg').innerHTML = on
                    ? '<rect x="2" y="2" width="3.5" height="10" fill="#fff"/><rect x="8.5" y="2" width="3.5" height="10" fill="#fff"/>'
                    : '<path d="M3 2v10l9-5z" fill="#fff"/>';
            };
            let listening = false;
            const startSpin = () => {
                const controls = below.cameraManager.getControls?.();
                if (controls && !listening) {
                    controls.addEventListener('start', () => setSpin(false));
                    listening = true;
                }
                setSpin(true);
            };
            button.addEventListener('click', () => setSpin(!spinning));
        }

        start();
    </script>
</body>
</html>
