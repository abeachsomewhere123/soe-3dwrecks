name: Deploy test site

on:
  push:
    branches: [ar-dev]
    paths: ["site/**", "cloudflare/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy -c cloudflare/wrangler.toml
